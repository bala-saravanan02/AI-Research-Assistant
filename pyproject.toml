[project]
name = "system-design"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "bala-saravanan02", email = "bala02saravanan2005@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "bcrypt>=4.2.0",
    "celery>=5.6.3",
    "dotenv>=0.9.9",
    "email-validator>=2.2.0",
    "fastapi>=0.141.1",
    "passlib>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "pandas>=2.2.0",
    "streamlit>=1.41.0",
    "fastmcp>=0.1.0",
    "langgraph>=1.2.11",
    "langsmith>=0.12.2",
    "mcp[cli]>=2.2.0",
    "openai>=3.8.0",
    "beautifulsoup4>=4.12.0",
    "psycopg2-binary>=2.9.13",
    "redis>=8.1.0",
    "requests>=2.32.0",
    "uvicorn>=0.52.4",
    "httpx>=0.27.2",     # Ensure a modern version of httpx is enforced
    "anyio>=4.4.0",
    "duckduckgo-search>=8.1.1",
    "tavily-python>=0.8.3",
]

[project.scripts]
system-design = "system_design:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
