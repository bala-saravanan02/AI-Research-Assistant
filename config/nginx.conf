events { 
    worker_connections 1024; 
}

http{
    
    upstream my_api_pool {
        #This is the load balancing part  Since we are planning to run inside the docker
        #We give the docker name so the docker uses Built in dns and then convert it into ip
        #If the appln is not running insdie teh docker , we should use the ip in that place.
        server api-instance-alpha:8000 max_fails=3 fail_timeout=10s;
        server api-instance-beta:8000 max_fails=3 fail_timeout=10s;
    }

    server {
        #This tells the Nginx where to sit and watch for incoming traffics
        #Here in this instead of the localhost we should use the domain name or public ip address in case it is running in the server.
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://my_api_pool;

            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 300s;
        }
    }

}